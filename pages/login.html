<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Craftity</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="theme-overworld">

<!-- ================= BARRA LATERAL (IDÉNTICA AL RESTO DEL SITIO) ================= -->
<aside class="sidebar" id="sidebar">

    <button class="toggle-sidebar-btn" id="btnToggleSidebar">
        <img src="../assets/images/toggle-icon.png" class="toggle-btn-img" alt="Toggle">
    </button>

    <div class="user-profile-wrapper">
        <a href="profile.html" class="user-profile-box">
            <img src="../assets/images/perfil.png" class="user-avatar-img" alt="Avatar">
            <span class="username sidebar-text">Invitado</span>
        </a>
    </div>

    <nav class="sidebar-nav">
        <a href="../index.html" class="nav-item">
            <img src="../assets/images/grass-block.png" class="sidebar-icon" alt="Home">
            <span class="sidebar-text">INICIO</span>
        </a>
        <a href="studio.html" class="nav-item">
            <img src="../assets/images/crafting-table.png" class="sidebar-icon" alt="Studio">
            <span class="sidebar-text">SKIN STUDIO</span>
        </a>
        <a href="learn.html" class="nav-item">
            <img src="../assets/images/book.png" class="sidebar-icon" alt="Learn">
            <span class="sidebar-text">LEARN CENTER</span>
        </a>
        <a href="repository.html" class="nav-item">
            <img src="../assets/images/chest.png" class="sidebar-icon" alt="Repo">
            <span class="sidebar-text">REPOSITORIO</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="login.html" class="nav-item login-btn active">
            <img src="../assets/images/totem.png" class="sidebar-icon" alt="Login">
            <span class="sidebar-text">INICIAR<br>SESIÓN</span>
        </a>
        <a href="#" class="nav-item settings-btn" id="btnAjustes">
            <img src="../assets/images/redstone.png" class="sidebar-icon" alt="Ajustes">
            <span class="sidebar-text">AJUSTES</span>
        </a>
    </div>

</aside>


<!-- ================= CONTENEDOR PRINCIPAL: LOGIN / REGISTRO ================= -->
<main class="main-content-wrapper">
    <div class="auth-content-inner">
        <div class="auth-box">

            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">INICIAR SESIÓN</button>
                <button class="auth-tab" id="tabRegister">REGISTRARSE</button>
            </div>

            <form id="formLogin" class="auth-form">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required autocomplete="email">

                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">

                <button type="submit" class="auth-submit-btn">INICIAR SESIÓN</button>
                <p class="auth-error" id="loginError"></p>
            </form>

            <form id="formRegister" class="auth-form" style="display:none;">
                <label for="registerUsername">Nombre de usuario</label>
                <input type="text" id="registerUsername" required minlength="3" autocomplete="username">

                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" required autocomplete="email">

                <label for="registerPassword">Contraseña</label>
                <input type="password" id="registerPassword" required minlength="6" autocomplete="new-password">

                <button type="submit" class="auth-submit-btn">CREAR CUENTA</button>
                <p class="auth-error" id="registerError"></p>
                <p class="auth-hint" id="registerHint"></p>
            </form>

        </div>
    </div>
</main>


<!-- ================= PANEL DE CONFIGURACIÓN MODULAR INTEGRAL (IDÉNTICO AL RESTO DEL SITIO) ================= -->
<div class="settings-modal" id="settingsModal">
    <div class="settings-box">

        <header class="settings-header">
            <h3>
                <img src="../assets/images/command-block.gif" class="settings-title-icon" alt="CmdBlock">
                CONFIGURACIÓN
            </h3>
            <button class="close-settings-btn" id="btnCloseSettings">❌</button>
        </header>

        <div class="settings-content">

            <section class="settings-section">
                <h4>
                    <img src="../assets/images/eye-of-ender.png" class="settings-title-icon" alt="Dimension">
                    SELECCIONAR DIMENSIÓN
                </h4>
                <div class="dimension-grid">
                    <button class="settings-action-btn active" id="btnThemeOverworld">
                        <img src="../assets/images/flower-dandelion.png" class="btn-dimension-icon" alt="Overworld"> OSCURO
                    </button>
                    <button class="settings-action-btn" id="btnThemeCuarzo">
                        <img src="../assets/images/flower-lily.png" class="btn-dimension-icon" alt="Cuarzo"> CLARO
                    </button>
                    <button class="settings-action-btn" id="btnThemeNether">
                        <img src="../assets/images/fungus-crimson.png" class="btn-dimension-icon" alt="Nether"> NETHER
                    </button>
                    <button class="settings-action-btn" id="btnThemeEnd">
                        <img src="../assets/images/coral-fruit.png" class="btn-dimension-icon" alt="End"> EL END
                    </button>
                </div>
            </section>

            <section class="settings-section">
                <h4>
                    <img src="../assets/images/jukebox-block.png" class="settings-title-icon" alt="Music">
                    JUKEBOX DE LA COMUNIDAD
                </h4>

                <div class="jukebox-player-wrapper">
                    <div class="now-playing-visor">
                        <span class="visor-label">AHORA SUENA:</span>
                        <span class="visor-track" id="visorTrackName">Minecraft Soundtrack - Ambient</span>
                    </div>
                    <div class="player-controls">
                        <button class="player-ctrl-btn" id="btnJukeboxPlay" title="Reproducir">▶</button>
                        <button class="player-ctrl-btn" id="btnJukeboxPause" title="Pausar">⏸</button>
                    </div>
                </div>

                <div class="volume-control">
                    <label for="volumeRange">
                        <img src="../assets/images/icon-noteblock.png" class="settings-title-icon" alt="Sound"> VOLUMEN:
                    </label>
                    <input type="range" id="volumeRange" min="0" max="100" value="50">
                </div>

                <button class="ambient-reset-btn active-disc" id="btnResetAmbient" data-track="ambient">
                    <img src="../assets/images/icon-sapling.gif" class="btn-dimension-icon" alt="Reset"> RESTAURAR MÚSICA AMBIENTAL
                </button>

                <div class="jukebox-grid dynamic-6-grid">
                    <button class="disc-btn" data-track="pigstep">
                        <img src="../assets/images/disc-pigstep.png" class="btn-disc-icon" alt="Pigstep"> Pigstep
                    </button>
                    <button class="disc-btn" data-track="otherside">
                        <img src="../assets/images/disc-otherside.png" class="btn-disc-icon" alt="Otherside"> Otherside
                    </button>
                    <button class="disc-btn" data-track="precipice">
                        <img src="../assets/images/disc-precipice.png" class="btn-disc-icon" alt="Precipice"> Precipice
                    </button>
                    <button class="disc-btn" data-track="cat">
                        <img src="../assets/images/disc-cat.png" class="btn-disc-icon" alt="Cat"> Cat
                    </button>
                    <button class="disc-btn" data-track="strad">
                        <img src="../assets/images/disc-strad.png" class="btn-disc-icon" alt="Strad"> Strad
                    </button>
                    <button class="disc-btn" data-track="far">
                        <img src="../assets/images/disc-far.png" class="btn-disc-icon" alt="Far"> Far
                    </button>
                </div>
                <audio id="jukeboxAudio" loop></audio>
            </section>

            <section class="settings-section">
                <h4>
                    <img src="../assets/images/book-written.png" class="settings-title-icon" alt="Language">
                    IDIOMA / LANGUAGE
                </h4>
                <div class="lang-row">
                    <button class="lang-btn active" data-lang="es">
                        <img src="../assets/images/flag-es.png" class="btn-lang-icon" alt="ES"> ESPAÑOL
                    </button>
                    <button class="lang-btn" data-lang="en">
                        <img src="../assets/images/flag-en.png" class="btn-lang-icon" alt="EN"> ENGLISH
                    </button>
                </div>
            </section>

        </div>
    </div>
</div>

<!-- TUS SCRIPTS SEPARADOS Y BLINDADOS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
